---
permalink: /book/
sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Redirect to the canonical booking page (single-sourced from _config.yml) -->
    <meta http-equiv="refresh" content="0; url={{ site.booking_url }}">
    <link rel="canonical" href="{{ site.booking_url }}">
    <meta name="robots" content="noindex, follow">

    <title>Book a 30-min architecture conversation - {{ site.title }}</title>
    <meta name="description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />

    <!-- Open Graph — so LinkedIn's Featured validator can assemble a card -->
    <meta property="og:title" content="Book a 30-min architecture conversation" />
    <meta property="og:description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />
    <meta property="og:url" content="{{ site.url }}/book/" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="{{ site.url }}/assets/og/personal-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book a 30-min architecture conversation" />
    <meta name="twitter:description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />
    <meta name="twitter:image" content="{{ site.url }}/assets/og/personal-og.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 32rem;
            margin: 20vh auto 0;
            padding: 0 1.5rem;
            color: #1a1a1a;
            line-height: 1.6;
            text-align: center;
        }
        a { color: #0b5cad; }
    </style>

    <!-- JS fallback in case meta-refresh is blocked -->
    <script>window.location.replace("{{ site.booking_url }}");</script>
</head>
<body>
    <p>Redirecting to booking&hellip;</p>
    <p>If you are not redirected automatically,
        <a href="{{ site.booking_url }}">click here to book a 30-minute architecture conversation</a>.</p>
</body>
</html>
