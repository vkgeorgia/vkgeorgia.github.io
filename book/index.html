<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- /book/ is an attribution interstitial: it logs a
         channel-stamped Cloudflare pageview (e.g. /book/?utm_source=linkedin)
         before handing off to the calendar, which strips query params itself.
         The redirect is briefly delayed so the analytics beacon can fire.

         There is deliberately no meta-refresh tag on this page (the literal tag
         name is kept out of the markup too, in case the validator matches on the
         raw string): LinkedIn's Featured validator reads such a tag as "this
         page is a redirect to another domain" and
         rejects the link (verified 2026-07-26 — the OG set, a self-canonical and
         index,follow were all in place and it still refused; the meta-refresh was
         the only remaining difference from the accepted home page). The JS
         redirect below is not seen by scrapers, which do not execute scripts;
         visitors without JS get the visible link in the body. -->
    <!-- canonical points at THIS page, not at the calendar: a cross-domain
         canonical made LinkedIn's Featured validator follow the link through to
         calendar.app.google (no OG there) and reject it as invalid — which
         defeated the whole point of the OG block below. Same reason the page is
         indexable: a noindex interstitial is a second rejection signal. It stays
         out of the sitemap via `sitemap: false` in the front matter. -->
    <link rel="canonical" href="https://korobeinikov.consulting/book/">
    <meta name="robots" content="index, follow">

    
    <!-- Cloudflare Web Analytics — loaded eagerly (not deferred) so the
         book-intent pageview is recorded before the redirect. -->
    <script src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c469758a75af452284beff013fcc9741"}'></script>
    

    <title>Book a 30-min architecture conversation - Valerii Korobeinikov</title>
    <meta name="description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />

    <!-- Open Graph — so LinkedIn's Featured validator can assemble a card -->
    <meta property="og:title" content="Book a 30-min architecture conversation" />
    <meta property="og:description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />
    <meta property="og:url" content="https://korobeinikov.consulting/book/" />
    <meta property="og:site_name" content="Valerii Korobeinikov" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://korobeinikov.consulting/assets/og/personal-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book a 30-min architecture conversation" />
    <meta name="twitter:description" content="Schedule a 30-minute architecture conversation with Valerii Korobeinikov." />
    <meta name="twitter:image" content="https://korobeinikov.consulting/assets/og/personal-og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">


    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 32rem;
            margin: 20vh auto 0;
            padding: 0 1.5rem;
            color: #1a1a1a;
            line-height: 1.6;
            text-align: center;
        }
        a { color: #0b5cad; }
    </style>

    <!-- Redirect after a short delay so the analytics beacon fires first. -->
    <script>
        setTimeout(function () {
            window.location.replace("https://calendar.app.google/yUQbbP2nkVaJgsvg9");
        }, 800);
    </script>
</head>
<body>
    <p>Redirecting to booking&hellip;</p>
    <p>If you are not redirected automatically,
        <a href="https://calendar.app.google/yUQbbP2nkVaJgsvg9">click here to book a 30-minute architecture conversation</a>.</p>
</body>
</html>
