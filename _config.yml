title: "Valerii Korobeinikov"
description: "Enterprise Architect and IT Consultant"
url: "https://korobeinikov.consulting"
baseurl: ""
lang: en

# Theme
theme: minima

# Author (Minima format)
author: Valerii Korobeinikov
email: valerii@korobeinikov.consulting

# Minima settings
minima:
  social_links:
    - platform: linkedin
      user_url: "https://www.linkedin.com/in/valeriikorobeinikov/"
    - platform: github
      user_url: "https://github.com/vkgeorgia"
    - platform: google
      # Keep in sync with booking_url below — YAML cannot reference another key,
      # so this is the one place the booking link is repeated.
      user_url: "https://calendar.app.google/yUQbbP2nkVaJgsvg9"

# Header pages - only show these in navigation
header_pages:
  - index.md
  - business-challenges.md
  - services/index.md
  - cases.md
  - articles.md

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins (only GitHub Pages supported plugins)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  # Emits meta-refresh redirect stubs for pages carrying `redirect_to` — used to
  # send retired taxonomy URLs to their surviving counterparts. Loaded explicitly
  # because the build runs `jekyll build` (not the github-pages command).
  - jekyll-redirect-from

# The github-pages gem auto-loads jekyll-optional-front-matter, which turns any
# front-matter-less markdown file into an *additional* themed, indexable HTML
# page on top of its static copy. The site serves such files as static copies,
# and every front-matter-less .md file already matches the plugin's own
# blacklist, so nothing relies on the plugin; disable it explicitly.
optional_front_matter:
  enabled: false

# Include digital-avatar frontend files
include:
  - digital-avatar/frontend

# Публичный URL backend (Cloud Run / Jeeves). Используется в Liquid в
# assets/projects-dynamic.js и digital-avatar/frontend/widget.js при сборке Jekyll.
# Для локальной подмены без коммита: _config.local.yml + --config _config.yml,_config.local.yml
backend_url: "https://ai-avatar-103512681014.us-central1.run.app"

# On-site "book a call" CTA target. Every book-a-call link in layouts, includes
# and page content points here — an internal interstitial — NOT straight at the
# calendar, so Cloudflare Web Analytics logs a channel-stamped /book/ pageview
# (book-intent) before the redirect. The booking tool strips query params, so
# /book/ is the one attributable chokepoint.
cta_url: "/book/"

# Google Calendar appointment schedule (Workspace account). The final booking
# destination — now referenced ONLY from /book/ (the interstitial redirects
# here) and the minima google social link above. On-site CTAs use cta_url.
# Change it here only; grep for a literal calendar.app.google URL outside this
# file before assuming a link is up to date.
booking_url: "https://calendar.app.google/yUQbbP2nkVaJgsvg9"

# Cloudflare Web Analytics token (JS beacon, public — visible in HTML source on live site, not a secret).
# Referenced from _layouts/default.html.
cloudflare_analytics_token: "c469758a75af452284beff013fcc9741"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - _site/
  - sources/
  - knowledge-base/*/sources/
  - digital-avatar/backend
  - digital-avatar/docs
  - digital-avatar/.env
  - digital-avatar/google_credentials.json
  - digital-avatar/README.md
  # Local-only docs / private brief in root (see .gitignore) — never build as pages
  - CLAUDE.md
  - vkgeorgia.icloud.com
  - STRATEGIC_BRIEF.md
  # Local build scripts (gitignored; carry internal labels) — never copy into _site
  - tools
  # Bastion agent run logs (gitignored locally; excluded defensively so a local
  # build never publishes or sitemaps them even if the folder is present)
  - logs
  # Build-time checkout of the private sanitized-cases repo — staged into _projects/,
  # never served directly
  - .cases-public-ready
  - script
  # Repo-internal notes for the SEO landing-page directories — not built
  - domains/README.md
  - industries/README.md
  - projects/README.md
  - roles/README.md
  # Archived stale content (see .gitignore) — not built by Jekyll
  - "0. archive"

# Collections
collections:
  # Case content is NOT committed here. At build time the deploy workflow copies
  # the sanitized projection from the private `cases-public-ready` repo (Layer 2)
  # into `_projects/`. Locally, run `script/stage-cases.sh` first. Committed
  # source carries no case bodies — single source of truth is the canon pipeline.
  # Each case renders at /cases/<endeavour_id>/ (the file name, e.g. /cases/24.05/) —
  # a structural numeric identifier, never a real name or internal code.
  projects:
    output: true
    permalink: /cases/:name/

# Apply the case layout to every staged case document (Layer-2 files carry no
# layout: of their own).
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: case
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  # Binary downloads and the digital-avatar demo stay served and linked, but
  # leave the sitemap — nothing meant for indexing points at a PDF or the demo.
  # jekyll-sitemap honours `sitemap: false` supplied through defaults for static
  # files.
  - scope:
      path: "downloads"
    values:
      sitemap: false
  - scope:
      path: "digital-avatar"
    values:
      sitemap: false
