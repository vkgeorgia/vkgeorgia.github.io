name: Agent-doc guard

# Fails if a plain CLAUDE.md / AGENTS.md is ever committed. These are internal,
# maintainer-local operating docs (gitignored) — they must never land in this
# public repo. gitignore is the first net; this CI check is the backstop that
# fires regardless of gitignore state (a force-add, a stale ignore, an agent slip).
# Adopter/product docs, if ever needed, use a `template`-suffixed name and are exempt.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  no-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No plain CLAUDE.md / AGENTS.md
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -iE '(^|/)(CLAUDE|AGENTS)\.md$' | grep -viE 'template' || true)"
          if [ -n "$hits" ]; then
            echo "::error::a plain CLAUDE.md/AGENTS.md is committed — internal operating docs must stay local/gitignored, not in this public repo"
            printf '%s\n' "$hits" | while IFS= read -r f; do echo "::error file=$f::not allowed here"; done
            exit 1
          fi
          echo "OK - no plain agent operating docs committed."
