name: public-surface-hygiene

# Jobs:
#   1. autofix       — rewrite hub pointers out of the PR TITLE/BODY. Non-blocking.
#   2. tree          — BLOCKING. Scan every tracked file for hub pointers + work-item refs.
#   3. no-agent-docs — BLOCKING. Fail if a plain CLAUDE.md / AGENTS.md is committed
#                      (the former agent-doc guard, merged here as its own job).
#   4. verify        — BLOCKING (PRs). Re-read the PR (post-autofix) + scan commit messages
#                      and the diff; fail if any pointer remains. Catches what autofix
#                      cannot touch: commit messages and committed file content.
# The private hub slug is held in the HYGIENE_HUB_SLUG repo secret, never in this
# file — so this public workflow does not itself name the hub, and its own diff
# does not trip the scan. Matched text is never printed. See CLAUDE.md §"Metadata hygiene".

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # A guard that only fires on pull requests is one merge path away from being
  # bypassed: a direct commit to main never faces it. The tree scan is the pass
  # that makes sense there (there is no PR to autofix or re-read), so the two
  # PR-only jobs are gated below.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

# Serialize per PR (no cancel): autofix's own edit fires one extra no-op run.
concurrency:
  group: hygiene-${{ github.event.pull_request.number }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Rewrite hub pointers in PR title/body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
        run: |
          set -euo pipefail
          if [ -z "${HUB:-}" ]; then echo "slug not configured; skipping."; exit 0; fi
          # Slug comes only from $ENV{HUB}; no literal appears in this file.
          # Order: consume the #N and URL forms before the bare-name catch-all.
          fix() {
            perl -0777 -pe '
              BEGIN { $h = quotemeta($ENV{HUB}); }
              s{\[(?:$h|strategy)\x23(\d+)\]\([^)]*\)}{HUB-$1}g;
              s{https?://github\.com/$h[^\s)]*}{the strategy hub}g;
              s{$h\x23(\d+)}{HUB-$1}g;
              s{strategy\x23(\d+)}{HUB-$1}g;
              s{$h}{the strategy hub}g;
            '
          }
          NEW_TITLE="$(printf '%s' "${PR_TITLE:-}" | fix)"
          printf '%s' "${PR_BODY:-}" | fix > /tmp/new_body.md
          changed=0
          [ "$NEW_TITLE" != "${PR_TITLE:-}" ] && changed=1
          cmp -s <(printf '%s' "${PR_BODY:-}") /tmp/new_body.md || changed=1
          if [ "$changed" -eq 0 ]; then echo "nothing to rewrite."; exit 0; fi
          gh pr edit "$PR_NUMBER" -R "$REPO" --title "$NEW_TITLE" --body-file /tmp/new_body.md
          echo "::notice::Rewrote the PR title/body."

  tree:
    runs-on: ubuntu-latest
    name: Full-tree scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a pull_request_target run this must be the PR head, not the base;
          # on push and manual runs the default checkout is what we want.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan every tracked file (blocking)
        env:
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
        run: |
          set -euo pipefail

          # The diff scan sees only what a PR adds, so a pointer that landed
          # before the guard existed stays invisible to it forever. This pass
          # reads every tracked text file instead.
          if [ -z "${HUB:-}" ]; then
            echo "::warning::slug not configured; scanning the cross-ref form only."
            PATTERN='strategy#[0-9]'
          else
            PATTERN="${HUB}|strategy#[0-9]"
          fi

          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in .github/workflows/public-surface-hygiene.yml) continue ;; esac
            if grep -Iqi -E "$PATTERN" "$f" 2>/dev/null; then
              echo "::error file=$f::Private-hub pointer in a tracked file. Reference the hub as HUB-<number>."
              fail=1
            fi
          done < <(git ls-files)

          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: full-tree scan failed. Matched terms are deliberately not printed - see the file paths above."
            exit 1
          fi
          echo "public-surface-hygiene: full-tree clean."

      - name: Work-item references in tracked files (blocking)
        shell: bash
        run: |
          set -euo pipefail

          # Committed content carries no work-item reference - see the verify
          # job for the rule. The pattern names nothing confidential, so the
          # matched token is printed; this workflow file is excluded, which
          # doubles as the escape hatch for a doc that must legitimately show the
          # form.
          #
          # Three branches: HUB-<n>; the hub-qualified unpunctuated form
          # (`hub task <n>` / `hub epic <n>` / `hub issue <n>`), where the
          # leading `hub` is what marks the number as an id; and the punctuated
          # `task|epic|hub #<n>`. Bare prose like "task 3 of the pipeline" has no
          # `hub` qualifier and no `#`, so it is not a reference and passes.
          WORKITEM='(\bHUB-[0-9]+|\bhub[[:space:]]+(task|epic|issue)s?[[:space:]:]+#?[0-9]+|\b(task|epic|hub)s?[[:space:]:]+#[0-9]+)'

          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in .github/workflows/public-surface-hygiene.yml) continue ;; esac
            hits="$(grep -oIiE "$WORKITEM" "$f" 2>/dev/null | sort -u | tr '\n' ' ' || true)"
            [ -n "$hits" ] || continue
            echo "::error file=$f::work-item reference in a tracked file ( ${hits}) - keep the reason and drop the number, or cite the decision by name and date"
            fail=1
          done < <(git ls-files)

          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: work-item references in committed content."
            exit 1
          fi
          echo "public-surface-hygiene: no work-item references in tracked files."

  no-agent-docs:
    runs-on: ubuntu-latest
    name: No agent operating docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a pull_request_target run this must be the PR head, not the base;
          # on push and manual runs the default checkout is what we want.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: No plain CLAUDE.md / AGENTS.md (blocking)
        run: |
          set -euo pipefail
          # Internal, maintainer-local operating docs (gitignored) must never land
          # in this public repo. gitignore is the first net; this check is the
          # backstop that fires regardless of gitignore state (a force-add, a
          # stale ignore, an agent slip). Template-suffixed names are exempt.
          hits="$(git ls-files | grep -iE '(^|/)(CLAUDE|AGENTS)\.md$' | grep -viE 'template' || true)"
          if [ -n "$hits" ]; then
            echo "::error::a plain CLAUDE.md/AGENTS.md is committed — internal operating docs must stay local/gitignored, not in this public repo"
            printf '%s\n' "$hits" | while IFS= read -r f; do echo "::error file=$f::not allowed here"; done
            exit 1
          fi
          echo "OK - no plain agent operating docs committed."

  verify:
    needs: autofix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Verify no hub pointer remains (blocking)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HUB: ${{ secrets.HYGIENE_HUB_SLUG }}
        run: |
          set -euo pipefail
          # Slug from the secret; the un-prefixed cross-ref stays literal (does not name the hub).
          if [ -z "${HUB:-}" ]; then
            echo "::warning::slug not configured; scanning the cross-ref form only."
            PATTERN='strategy#[0-9]'
          else
            PATTERN="${HUB}|strategy#[0-9]"
          fi
          fail=0
          # $1 = location label, $2 = text. Only the location is echoed, never the match.
          check() {
            if printf '%s' "${2:-}" | grep -Eiq "$PATTERN"; then
              echo "::error::Private-hub pointer remains in $1. Reference the hub by a bare number or by name. Autofix covers the PR title/body; fix commit messages and committed content by hand. See CLAUDE.md metadata-hygiene section."
              fail=1
            fi
          }
          TITLE="$(gh pr view "$PR_NUMBER" -R "$REPO" --json title --jq '.title')"
          BODY="$(gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq '.body // ""')"
          COMMITS="$(gh pr view "$PR_NUMBER" -R "$REPO" --json commits --jq '.commits[] | .messageHeadline + "\n" + (.messageBody // "")')"
          # Exclude this workflow file from the diff scan (belt-and-suspenders).
          DIFF="$(gh pr diff "$PR_NUMBER" -R "$REPO" | awk '
            /^diff --git / { skip = ($0 ~ /public-surface-hygiene\.yml/) }
            skip { next }
            { print }
          ' | grep -E '^\+' | grep -Ev '^\+\+\+' || true)"
          check "the PR title" "$TITLE"
          check "the PR body" "$BODY"
          check "a commit message" "$COMMITS"
          check "an added diff line" "$DIFF"

          # A work-item reference does not go on a public surface: not in an
          # added diff line, not in a commit message, not in a PR title or body.
          # It lives in the hub issue, which already links to the pull request.
          #
          # Two operative reasons, both about how the text reads later: a number
          # is not a reason (what a line needs is why it is the way it is, and the
          # durable form for that is a decision cited by name and date), and PR
          # metadata is committed content with a delay - this repository squashes
          # with COMMIT_OR_PR_TITLE and merges with PR_TITLE, so a PR title
          # becomes a commit subject on the default branch.
          #
          # This repository's own issues and PRs are untouched: a plain
          # hash-number, and `closes` / `fixes`, mean what they say. The bare
          # hash-number dressed as hub work is the worst form - it auto-links to
          # the item of that number in THIS repository. These patterns name
          # nothing confidential, so the matched token is printed.
          #
          # Kept in sync with the tree job's WORKITEM: HUB-<n>, the hub-qualified
          # unpunctuated form (`hub task|epic|issue <n>`), and the punctuated
          # `task|epic|hub #<n>`. Bare "task 3 of the pipeline" is prose, not a
          # reference, and passes.
          WORKITEM='(\bHUB-[0-9]+|\bhub[[:space:]]+(task|epic|issue)s?[[:space:]:]+#?[0-9]+|\b(task|epic|hub)s?[[:space:]:]+#[0-9]+)'
          ADVICE="a work-item reference does not go on a public surface - keep the reason and drop the number, cite the decision by name and date, and leave the work-item trail in the hub issue"
          wi() {  # $1 = label, $2 = text, $3 = pattern, $4 = advice
            local hits
            hits="$(printf '%s' "${2:-}" | grep -oiE "$3" | sort -u | tr '\n' ' ' || true)"
            [ -n "$hits" ] || return 0
            echo "::error::work-item reference in $1 ( $hits) - $4"
            fail=1
          }
          wi "the PR title" "$TITLE" "$WORKITEM" "$ADVICE"
          wi "the PR body" "$BODY" "$WORKITEM" "$ADVICE"
          wi "a commit message" "$COMMITS" "$WORKITEM" "$ADVICE"
          wi "an added diff line" "$DIFF" "$WORKITEM" "$ADVICE"
          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: blocking check failed. Fix the reference(s) and push again."
            exit 1
          fi
          echo "public-surface-hygiene: clean."
