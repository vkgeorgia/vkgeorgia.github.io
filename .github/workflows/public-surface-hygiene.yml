name: public-surface-hygiene

# Two steps on every PR:
#   1. autofix  — rewrite hub pointers in the PR TITLE/BODY (strategy#N,
#                 vkgeorgia/strategy#N, a hub URL) to "hub task N". Non-blocking.
#   2. verify   — BLOCKING. Re-read the PR (post-autofix) + scan commit messages
#                 and the diff; fail if any hub pointer remains. This catches what
#                 autofix cannot touch: commit messages and committed file content.
# The operational `gh ... -R vkgeorgia/strategy` command form is never matched.
# See CLAUDE.md §"Metadata hygiene".

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

# Serialize per PR (no cancel): autofix's own edit fires one extra no-op run.
concurrency:
  group: hygiene-${{ github.event.pull_request.number }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite hub pointers in PR title/body → "hub task N"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fix() {
            perl -0777 -pe '
              s{\[(?:vkgeorgia/)?strategy#(\d+)\]\(https://github\.com/vkgeorgia/strategy[^)]*\)}{hub task $1}g;
              s{https://github\.com/vkgeorgia/strategy[^\s)]*}{the strategy hub}g;
              s{vkgeorgia/strategy#(\d+)}{hub task $1}g;
              s{strategy#(\d+)}{hub task $1}g;
            '
          }
          NEW_TITLE="$(printf '%s' "${PR_TITLE:-}" | fix)"
          printf '%s' "${PR_BODY:-}" | fix > /tmp/new_body.md
          changed=0
          [ "$NEW_TITLE" != "${PR_TITLE:-}" ] && changed=1
          cmp -s <(printf '%s' "${PR_BODY:-}") /tmp/new_body.md || changed=1
          if [ "$changed" -eq 0 ]; then
            echo "No hub pointers in the PR title/body — nothing to rewrite."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" -R "$REPO" --title "$NEW_TITLE" --body-file /tmp/new_body.md
          echo "::notice::Rewrote private-hub pointer(s) in this PR's title/body to \"hub task N\"."

  verify:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - name: Verify no hub pointer remains (blocking)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ERE. The `gh -R vkgeorgia/strategy` command form is intentionally NOT matched.
          PATTERN='strategy#[0-9]|vkgeorgia/strategy#|github\.com/vkgeorgia/strategy'
          fail=0
          # $1 = location label, $2 = text. Only the location is echoed, never the match.
          check() {
            if printf '%s' "${2:-}" | grep -Eiq "$PATTERN"; then
              echo "::error::Private-hub pointer remains in $1. Reference the hub by a bare number or by name — never strategy#N, vkgeorgia/strategy#N, or a hub URL. Autofix covers the PR title/body; commit messages and committed content must be fixed by hand. See CLAUDE.md §\"Metadata hygiene\"."
              fail=1
            fi
          }
          # Re-read the PR live — after autofix, so title/body reflect the rewrite.
          TITLE="$(gh pr view "$PR_NUMBER" -R "$REPO" --json title --jq '.title')"
          BODY="$(gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq '.body // ""')"
          COMMITS="$(gh pr view "$PR_NUMBER" -R "$REPO" --json commits --jq '.commits[] | .messageHeadline + "\n" + (.messageBody // "")')"
          DIFF="$(gh pr diff "$PR_NUMBER" -R "$REPO" | grep -E '^\+' | grep -Ev '^\+\+\+' || true)"
          check "the PR title" "$TITLE"
          check "the PR body" "$BODY"
          check "a commit message" "$COMMITS"
          check "an added diff line" "$DIFF"
          if [ "$fail" -ne 0 ]; then
            echo "::error::public-surface-hygiene: blocking check failed. Fix the reference(s) and push again. (The matched text is not printed on purpose.)"
            exit 1
          fi
          echo "public-surface-hygiene: clean."
