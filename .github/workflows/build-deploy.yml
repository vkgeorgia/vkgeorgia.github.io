name: Build

# Jekyll build and crawlability check. Does not publish.
# Case files are not in this repository; production publish runs on the
# 24/7 host from a local private clone (no Actions deploy key).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify links, sitemap, and robots.txt are consistent
        run: bundle exec ruby script/verify-crawlability.rb
