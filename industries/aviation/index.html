    <!-- Inbound channel capture + book-CTA decoration (hub task 217).
         First-touch source (a utm_source on the landing URL, or a LinkedIn
         referrer) is kept for the session and stamped onto the internal /book/
         links, so Cloudflare Web Analytics logs each book-intent pageview with
         its channel. The booking tool strips query params, so /book/ is the
         attributable chokepoint. Best-effort — never breaks the page. -->
    <script>
    (function () {
        try {
            var KEY = 'inbound_src';
            var src = new URLSearchParams(window.location.search).get('utm_source');
            if (!src && document.referrer) {
                var host = '';
                try { host = new URL(document.referrer).hostname; } catch (e) {}
                if (host && host.indexOf('linkedin.') > -1) { src = 'linkedin'; }
            }
            if (src && !sessionStorage.getItem(KEY)) {
                sessionStorage.setItem(KEY, src); // first-touch within the session
            }
            var channel = sessionStorage.getItem(KEY) || 'vkgeorgia_io';
            document.addEventListener('DOMContentLoaded', function () {
                var links = document.querySelectorAll('a[href^="/book/"], a[href="/book"]');
                Array.prototype.forEach.call(links, function (a) {
                    var u = new URL(a.getAttribute('href'), window.location.origin);
                    if (!u.searchParams.get('utm_source')) {
                        u.searchParams.set('utm_source', channel);
                        u.searchParams.set('utm_medium', 'site_cta');
                    }
                    a.setAttribute('href', u.pathname + u.search);
                });
            });
        } catch (e) { /* attribution is best-effort; never break the page */ }
    })();
    </script>
